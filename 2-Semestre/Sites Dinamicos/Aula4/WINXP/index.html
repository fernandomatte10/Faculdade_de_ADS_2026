<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LoginADS</title>
    <link rel="stylesheet" href="Style/Css.css">

</head>

<body>

    <form id="id_form">

        <div class="cabecalho">
            <h1>Log On to Windows</h1>
        </div>

        <div class="conteudo">

            <img class="logo" src="IMGs/xp.png" alt="Logo do Windows XP">

            <text class="texto">Copyright © 1985-2001</text>
            <text class="texto">Microsoft Corporation</text>
            <text class="texto1">Microsoft</text>

            <div class="campologin">
                <div class="bordacolorida">
            </div>

            <div class="campo">
                <label>User name:</label>
                <input type="text" id="id_username">
            </div>

            <div class="campo">
                <label>Password:</label>
                <input type="password" id="id_password">
            </div>

            <div class="botoes">

                <button type="submit" class="botao" onclick="login()">
                    OK
                </button>

                <button type="button" class="botao">
                    Cancel
                </button>

                <button type="button" class="botao">
                    Options >>
                </button>

            </div>

        </div>

    </form>

    <script src="JAVA_S/javaS.js"></script>

</body>

</html>
