<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <title>LoginADS</title>
        <link rel="stylesheet" href="Style/Css.css">

    </head>

    <body>

        <!-- Faz o navegador entender que isso é um formulário, botão funciona ao apertar ENTER -->
        <form id="id_form">

            <div class="formulario">
                <h1>Formulário</h1>

                    <label>Nome:</label>
                    <input class="nome" type="text" id="id_nome">

                    <label>Idade:</label>
                    <input class="idade" type="number" id="id_idade">

                    <label>Data de nascimento:</label>
                    <input class="data-nascimento" type="date" id="id_data_nascimento">

                    <!-- type="submit" em vez de type="button" para o Enter acionar o botão ENVIAR -->
                    <button class="botao" type="submit" onclick="vervalores()">ENVIAR</button>

            </div>
            
        </form>

        <script src="JAVA_S/javaS.js"></script>

    </body>
</html>
